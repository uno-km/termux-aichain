name: "termux-aichain"
package_name_pypi: "termux-aichain"
package_name_npm: "@termux-ai/chain"
version: "v0.1.0"
release_name: "Sovereign Edge Release"
license: "Apache-2.0"
platform: "Android Termux / ARM64 / Linux / Edge"
github_repo_url: "https://github.com/uno-km/termux-aichain"

tagline_en: "Sovereign Zero-Dependency AI Chaining and Agent Framework for Termux & Android Edge"
tagline_ko: "Termux 및 안드로이드 엣지 환경을 위한 무의존성 주권 AI 체이닝 및 에이전트 프레임워크"

quick_install_cmd: "pip install termux-aichain\n# or for Node.js:\nnpm install @termux-ai/chain"

why_challenge_en: "Mainstream AI frameworks (LangChain, LlamaIndex, CrewAI) introduce 80+ heavy dependencies, 250MB+ RSS overheads, and frequent compilation failures on ARM Android devices."
why_challenge_ko: "기존 랭체인 생태계는 80개 이상의 무거운 외부 의존성, 250MB 이상의 메모리 점유, ARM 안드로이드 상에서의 휠 컴파일 오류로 인해 엣지 환경 구동에 한계가 있습니다."

description_en: "Engineered under the Zero-Heavy-Dependency doctrine: Pure Python stdlib and pure Node.js ESM orchestration for local llama-server, BitNet 1-bit models, state graphs, and native Termux hardware APIs."
description_ko: "외부 무거운 의존성 0개 원칙으로 설계되어, 순수 표준 라이브러리만으로 로컬 llama-server, BitNet 1-bit 모델, 상태 그래프 머신, SQLite 메모리, 네이티브 하드웨어 도구를 완벽히 통합합니다."

features:
  - title_en: "Zero External Heavy Dependencies"
    title_ko: "외부 무거운 의존성 0개"
    desc_en: "Pure Python standard library and pure Node.js ESM. Cold start import in under 18ms with less than 280KB disk footprint."
    desc_ko: "순수 표준 라이브러리 및 순수 ESM 구성으로 18ms 미만의 초고속 임포트와 280KB 미만의 경량 패키징을 실현합니다."
  - title_en: "StateGraph & ReAct Engine"
    title_ko: "상태 그래프 및 ReAct 자율 루프"
    desc_en: "Deterministic cyclic state machines and autonomous tool-calling loops (LangGraph lightweight alternative)."
    desc_ko: "순환 루프와 조건부 라우팅을 지원하는 결정론적 상태 머신 및 자율 도구 호출 루프를 내장합니다."
  - title_en: "SQLite Long-Term Memory"
    title_ko: "SQLite 영속 메모리 및 코사인 색인"
    desc_en: "Persistent entity key-value storage and pure cosine vector search without ChromaDB or NumPy."
    desc_ko: "ChromaDB나 NumPy 없이 순수 표준 라이브러리만으로 영속 엔티티 저장 및 코사인 유사도 벡터 검색을 지원합니다."
  - title_en: "1-Line REST & SSE Server"
    title_ko: "1줄 로컬 REST 및 SSE 스트리밍 서빙"
    desc_en: "Exposes any agent or chain over local mobile WiFi with Server-Sent Events without FastAPI overhead."
    desc_ko: "FastAPI 의존성 없이 로컬 WiFi 네트워크에 에이전트를 REST 및 SSE 실시간 스트리밍으로 1줄 서빙합니다."
  - title_en: "CLI Tree Tracer & TPS Meter"
    title_ko: "CLI 트리 추적 로거 및 TPS 프로파일러"
    desc_en: "Hierarchical ANSI tree visualization, millisecond latency profiling, and token throughput meters."
    desc_ko: "계층형 ANSI 트리 시각화, 밀리초 단위 지연시간 및 토큰 초당 생성속도(TPS)를 클라우드 없이 로컬 측정합니다."
  - title_en: "Native Android Hardware Toolkit"
    title_ko: "안드로이드 네이티브 하드웨어 도구"
    desc_en: "Direct tool-calling wrappers for Termux-API (battery status, sensors, GPS location, STT, TTS, vibration)."
    desc_ko: "배터리 상태, 가속도/조도 센서, GPS 위치, 음성 인식(STT), 음성 합성(TTS), 진동을 에이전트 도구로 직결합니다."

matrix_table:
  - category: "Core Orchestration"
    operations: "PromptTemplate, ChatPromptTemplate, Runnable, | Pipe Operator, JsonOutputParser, Splitters"
    status: "Production Ready"
  - category: "Multi-Agent Graph"
    operations: "StateGraph, CompiledGraph, START, END, Tool, @tool, create_react_agent"
    status: "Production Ready"
  - category: "Long-Term Memory"
    operations: "ConversationBufferMemory, SQLiteEntityMemory, SQLiteVectorStore, FactExtractor"
    status: "Production Ready"
  - category: "Local Serving & Tracing"
    operations: "AgentServer, serve(), Tracer, TraceSpan, @traceable, Tree Renderer"
    status: "Production Ready"
  - category: "Device Hardware API"
    operations: "Battery, Sensors, GPS Location, STT Voice, TTS Audio, Vibration, Shell Execution"
    status: "Production Ready"
  - category: "On-Device Inference"
    operations: "OpenAICompatibleChat, BitNetChat (llama-server, bitnet.cpp, ollama)"
    status: "Production Ready"

code_example_py: |
  from termux_aichain import (
      BitNetChat,
      create_react_agent,
      get_default_device_tools,
      Tracer,
      HumanMessage
  )

  # 1. Connect to local 1-bit or GGUF LLM
  llm = BitNetChat(base_url="http://127.0.0.1:8088/v1", model="bitnet-b1.58-3b")

  # 2. Compile ReAct Agent with native Android device tools
  agent = create_react_agent(model=llm, tools=get_default_device_tools())

  # 3. Profile execution with local CLI tracer
  tracer = Tracer("EdgeMobileRun")
  with tracer.trace("AgentExecution"):
      result = agent.invoke({"messages": [HumanMessage(content="Check battery and sensor status.")]})

  tracer.finish()
  tracer.print_tree()
  print("Agent Output:", result["messages"][-1].content)

code_example_js: |
  import {
    PromptTemplate,
    StateGraph,
    MicroVectorStore,
    serve
  } from "@termux-ai/chain";

  const prompt = PromptTemplate.fromTemplate("Edge Task: {task}");
  const server = serve(prompt, { host: "0.0.0.0", port: 8080 });